name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd фуллстек/citizen-requests/backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Run backend tests
        run: |
          cd фуллстек/citizen-requests/backend
          pytest -v

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd фуллстек/citizen-requests/frontend
          npm ci
      - name: Run frontend unit tests
        run: |
          cd фуллстек/citizen-requests/frontend
          npm run test

  build-images:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub (optional)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./фуллстек/citizen-requests/backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/citizen-backend:latest
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./фуллстек/citizen-requests/frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/citizen-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "фуллстек/citizen-requests/docker-compose.yml,фуллстек/citizen-requests/nginx/nginx.conf,фуллстек/citizen-requests/.env"
          target: "/opt/citizen-requests"
      - name: Deploy with docker-compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/citizen-requests
            docker-compose down
            docker-compose pull
            docker-compose up -d
